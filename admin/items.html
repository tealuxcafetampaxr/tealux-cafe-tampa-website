<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Items | Tealux Cafe Tampa Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>
  <nav class="admin-nav">
    <a href="/admin/items.html" class="admin-logo">
      <span class="admin-logo-main">TEALUX CAFE</span>
      <span class="admin-logo-sub">EMPLOYEE TOOLS</span>
    </a>
    <ul class="admin-nav-links">
      <li><a href="/admin/items.html" class="active">Items</a></li>
      <li><a href="/admin/boards.html">Menu Boards</a></li>
      <li><button type="button" data-signout>Log Out</button></li>
    </ul>
  </nav>

  <main class="admin-main">
    <div class="admin-header-row">
      <h1>Item Catalog</h1>
      <div class="admin-actions">
        <button type="button" class="btn btn-outline" id="btn-duplicate" disabled>Duplicate</button>
        <a href="/admin/item.html" class="btn btn-crimson">+ Add Item</a>
      </div>
    </div>

    <div class="items-toolbar" id="items-toolbar" style="display:none;">
      <input type="search" id="search-input" placeholder="Search items…" />
      <select id="filter-category"><option value="">All categories</option></select>
      <select id="filter-status">
        <option value="">All statuses</option>
        <option value="active">Active</option>
        <option value="sold_out">Sold Out</option>
      </select>
      <select id="filter-tag">
        <option value="">All tags</option>
        <option value="new">New</option>
        <option value="best_seller">Best Seller</option>
        <option value="limited">Limited</option>
        <option value="none">No tag</option>
      </select>
      <span class="results-count" id="results-count"></span>
    </div>

    <div class="panel" style="padding:0;">
      <div id="loading" class="spinner-row"><span class="loading-spinner"></span></div>
      <div class="table-wrap" style="display:none;" id="table-wrap">
        <table class="item-table">
          <thead>
            <tr>
              <th style="width:36px;"></th>
              <th style="width:64px;"></th>
              <th class="sortable" data-sort="name">Item <span class="sort-arrow"></span></th>
              <th class="sortable" data-sort="category">Category <span class="sort-arrow"></span></th>
              <th class="sortable" data-sort="price">Price <span class="sort-arrow"></span></th>
              <th class="sortable" data-sort="status">Status <span class="sort-arrow"></span></th>
              <th class="sortable" data-sort="tag">Tag <span class="sort-arrow"></span></th>
            </tr>
          </thead>
          <tbody id="item-rows"></tbody>
        </table>
      </div>
      <div class="empty-state" id="empty-state" style="display:none;">
        <p id="empty-state-text">No items yet. Add your first menu item to get started.</p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/admin/js/supabase-client.js"></script>
  <script>
    let items = [];
    let selectedId = null;
    let sortKey = null;
    let sortDir = 'asc';
    const filters = { search: '', category: '', status: '', tag: '' };

    function money(n) {
      return '$' + Number(n || 0).toFixed(2);
    }

    function tagLabel(tag) {
      return { none: '', new: 'New', best_seller: 'Best Seller', limited: 'Limited' }[tag] || '';
    }

    function populateCategoryFilter() {
      const select = document.getElementById('filter-category');
      const current = select.value;
      const cats = [...new Set(items.map((i) => (i.category || '').trim()).filter(Boolean))].sort();
      select.innerHTML = '<option value="">All categories</option>' +
        cats.map((c) => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
      if (cats.includes(current)) select.value = current;
    }

    function getVisibleItems() {
      const q = filters.search.trim().toLowerCase();
      let list = items.filter((it) => {
        if (filters.category && (it.category || '') !== filters.category) return false;
        if (filters.status && it.status !== filters.status) return false;
        if (filters.tag && it.tag !== filters.tag) return false;
        if (q) {
          const haystack = [it.name, it.description, it.category].filter(Boolean).join(' ').toLowerCase();
          if (!haystack.includes(q)) return false;
        }
        return true;
      });

      if (sortKey) {
        list = list.slice().sort((a, b) => {
          let av = a[sortKey];
          let bv = b[sortKey];
          if (sortKey === 'price') {
            av = Number(av) || 0;
            bv = Number(bv) || 0;
          } else {
            av = (av || '').toString().toLowerCase();
            bv = (bv || '').toString().toLowerCase();
          }
          if (av < bv) return sortDir === 'asc' ? -1 : 1;
          if (av > bv) return sortDir === 'asc' ? 1 : -1;
          return 0;
        });
      }

      return list;
    }

    function updateSortIndicators() {
      document.querySelectorAll('th.sortable').forEach((th) => {
        const arrow = th.querySelector('.sort-arrow');
        arrow.textContent = th.dataset.sort === sortKey ? (sortDir === 'asc' ? '▲' : '▼') : '';
      });
    }

    function renderRows() {
      const tbody = document.getElementById('item-rows');
      tbody.innerHTML = '';
      const visible = getVisibleItems();

      document.getElementById('results-count').textContent =
        `${visible.length} of ${items.length} item${items.length === 1 ? '' : 's'}`;

      if (items.length === 0) {
        document.getElementById('table-wrap').style.display = 'none';
        document.getElementById('empty-state').style.display = '';
        document.getElementById('empty-state-text').textContent = 'No items yet. Add your first menu item to get started.';
        return;
      }
      if (visible.length === 0) {
        document.getElementById('table-wrap').style.display = 'none';
        document.getElementById('empty-state').style.display = '';
        document.getElementById('empty-state-text').textContent = 'No items match your search or filters.';
        return;
      }
      document.getElementById('table-wrap').style.display = '';
      document.getElementById('empty-state').style.display = 'none';

      visible.forEach((item) => {
        const tr = document.createElement('tr');
        tr.dataset.id = item.id;

        const thumbCell = item.primary_image_url
          ? `<img class="item-thumb" src="${item.primary_image_url}" alt="" />`
          : `<div class="item-thumb-placeholder">—</div>`;

        tr.innerHTML = `
          <td onclick="event.stopPropagation()"><input type="radio" name="select-item" data-select ${item.id === selectedId ? 'checked' : ''} /></td>
          <td>${thumbCell}</td>
          <td>
            <strong>${escapeHtml(item.name)}</strong>
            ${item.featured ? ' <span class="badge badge-featured">★</span>' : ''}
          </td>
          <td>${escapeHtml(item.category || '—')}</td>
          <td>${money(item.price)}</td>
          <td><span class="badge badge-${item.status}">${item.status === 'active' ? 'Active' : 'Sold Out'}</span></td>
          <td>${tagLabel(item.tag) ? `<span class="badge badge-tag">${tagLabel(item.tag)}</span>` : ''}</td>
        `;

        tr.addEventListener('click', () => {
          window.location.href = `/admin/item.html?id=${item.id}`;
        });
        const radio = tr.querySelector('[data-select]');
        radio.addEventListener('click', (e) => {
          e.stopPropagation();
          // Radios don't natively toggle off on a second click — do it manually.
          if (selectedId === item.id) {
            selectedId = null;
            radio.checked = false;
            document.getElementById('btn-duplicate').disabled = true;
          } else {
            selectedId = item.id;
            document.getElementById('btn-duplicate').disabled = false;
          }
        });

        tbody.appendChild(tr);
      });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    async function loadItems() {
      const { data: itemRows, error } = await sb
        .from('items')
        .select('*')
        .order('sort_order', { ascending: true });

      if (error) {
        console.error(error);
        document.getElementById('loading').textContent = 'Failed to load items.';
        return;
      }

      const { data: imageRows } = await sb
        .from('item_images')
        .select('item_id, storage_url, is_primary')
        .eq('is_primary', true);

      const primaryByItem = {};
      (imageRows || []).forEach((img) => { primaryByItem[img.item_id] = img.storage_url; });

      items = (itemRows || []).map((it) => ({ ...it, primary_image_url: primaryByItem[it.id] || null }));

      document.getElementById('loading').style.display = 'none';
      document.getElementById('items-toolbar').style.display = '';
      populateCategoryFilter();
      renderRows();
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      filters.search = e.target.value;
      renderRows();
    });
    document.getElementById('filter-category').addEventListener('change', (e) => {
      filters.category = e.target.value;
      renderRows();
    });
    document.getElementById('filter-status').addEventListener('change', (e) => {
      filters.status = e.target.value;
      renderRows();
    });
    document.getElementById('filter-tag').addEventListener('change', (e) => {
      filters.tag = e.target.value;
      renderRows();
    });

    document.querySelectorAll('th.sortable').forEach((th) => {
      th.addEventListener('click', () => {
        const key = th.dataset.sort;
        if (sortKey === key) {
          sortDir = sortDir === 'asc' ? 'desc' : 'asc';
        } else {
          sortKey = key;
          sortDir = 'asc';
        }
        updateSortIndicators();
        renderRows();
      });
    });

    document.getElementById('btn-duplicate').addEventListener('click', async () => {
      if (!selectedId) return;
      const source = items.find((i) => i.id === selectedId);
      if (!source) return;

      const { id, created_at, updated_at, primary_image_url, ...rest } = source;
      rest.name = source.name + ' (Copy)';

      const { data, error } = await sb.from('items').insert(rest).select().single();
      if (error) {
        alert('Could not duplicate item: ' + error.message);
        return;
      }
      window.location.href = `/admin/item.html?id=${data.id}`;
    });

    (async () => {
      const session = await requireSession();
      if (!session) return;
      wireSignOutButtons();
      loadItems();
    })();
  </script>
</body>
</html>
