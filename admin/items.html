<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Items | Tealux Cafe Tampa Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>
  <nav class="admin-nav">
    <a href="/admin/items.html" class="admin-logo">
      <span class="admin-logo-main">TEALUX CAFE</span>
      <span class="admin-logo-sub">EMPLOYEE TOOLS</span>
    </a>
    <ul class="admin-nav-links">
      <li><a href="/admin/items.html" class="active">Items</a></li>
      <li><a href="/admin/boards.html">Menu Boards</a></li>
      <li><button type="button" data-signout>Log Out</button></li>
    </ul>
  </nav>

  <main class="admin-main">
    <div class="admin-header-row">
      <h1>Item Catalog</h1>
      <div class="admin-actions" id="actions-normal">
        <button type="button" class="btn btn-outline" id="btn-duplicate" disabled>Duplicate</button>
        <button type="button" class="btn btn-outline" id="btn-edit-table">Edit</button>
        <a href="/admin/item.html" class="btn btn-crimson">+ Add Item</a>
      </div>
      <div class="admin-actions" id="actions-editing" style="display:none;">
        <button type="button" class="btn btn-outline" id="btn-cancel-edit">Cancel</button>
        <button type="button" class="btn btn-crimson" id="btn-save-edit">Save Changes</button>
      </div>
    </div>

    <div class="items-toolbar" id="items-toolbar" style="display:none;">
      <input type="search" id="search-input" placeholder="Search items…" />
      <select id="filter-category"><option value="">All categories</option></select>
      <select id="filter-status">
        <option value="">All statuses</option>
        <option value="active">Active</option>
        <option value="sold_out">Sold Out</option>
        <option value="inactive">Inactive</option>
      </select>
      <select id="filter-tag">
        <option value="">All tags</option>
        <option value="new">New</option>
        <option value="best_seller">Best Seller</option>
        <option value="limited">Limited</option>
        <option value="none">No tag</option>
      </select>
      <span class="results-count" id="results-count"></span>
    </div>
    <p class="editing-note" id="editing-note" style="display:none;">Editing — search, filters, and sorting are locked until you save or cancel.</p>

    <div class="panel" style="padding:0;">
      <div id="loading" class="spinner-row"><span class="loading-spinner"></span></div>
      <div class="table-wrap" style="display:none;" id="table-wrap">
        <table class="item-table">
          <thead>
            <tr>
              <th style="width:36px;"></th>
              <th style="width:64px;"></th>
              <th class="sortable" data-sort="name">Item <span class="sort-arrow"></span></th>
              <th class="sortable" data-sort="category">Category <span class="sort-arrow"></span></th>
              <th class="sortable" data-sort="price">Price <span class="sort-arrow"></span></th>
              <th class="sortable" data-sort="status">Status <span class="sort-arrow"></span></th>
              <th class="sortable" data-sort="tag">Tag <span class="sort-arrow"></span></th>
            </tr>
          </thead>
          <tbody id="item-rows"></tbody>
        </table>
      </div>
      <div class="empty-state" id="empty-state" style="display:none;">
        <p id="empty-state-text">No items yet. Add your first menu item to get started.</p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/admin/js/supabase-client.js"></script>
  <script>
    let items = [];
    let selectedId = null;
    let sortKey = null;
    let sortDir = 'asc';
    const filters = { search: '', category: '', status: '', tag: '' };
    let editMode = false;
    let pendingEdits = {}; // itemId -> { name, category, price, status, tag }
    let dirty = false;

    function markDirty() { dirty = true; }
    warnOnUnsavedChanges(() => dirty);

    function getCategoryList() {
      return [...new Set(items.map((i) => (i.category || '').trim()).filter(Boolean))].sort();
    }

    function money(n) {
      return '$' + Number(n || 0).toFixed(2);
    }

    function tagLabel(tag) {
      return { none: '', new: 'New', best_seller: 'Best Seller', limited: 'Limited' }[tag] || '';
    }

    function statusLabel(status) {
      return { active: 'Active', sold_out: 'Sold Out', inactive: 'Inactive' }[status] || status;
    }

    function populateCategoryFilter() {
      const select = document.getElementById('filter-category');
      const current = select.value;
      const cats = getCategoryList();
      select.innerHTML = '<option value="">All categories</option>' +
        cats.map((c) => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
      if (cats.includes(current)) select.value = current;
    }

    function getVisibleItems() {
      const q = filters.search.trim().toLowerCase();
      let list = items.filter((it) => {
        if (filters.category && (it.category || '') !== filters.category) return false;
        if (filters.status && it.status !== filters.status) return false;
        if (filters.tag && it.tag !== filters.tag) return false;
        if (q) {
          const haystack = [it.name, it.description, it.category].filter(Boolean).join(' ').toLowerCase();
          if (!haystack.includes(q)) return false;
        }
        return true;
      });

      if (sortKey) {
        list = list.slice().sort((a, b) => {
          let av = a[sortKey];
          let bv = b[sortKey];
          if (sortKey === 'price') {
            av = Number(av) || 0;
            bv = Number(bv) || 0;
          } else {
            av = (av || '').toString().toLowerCase();
            bv = (bv || '').toString().toLowerCase();
          }
          if (av < bv) return sortDir === 'asc' ? -1 : 1;
          if (av > bv) return sortDir === 'asc' ? 1 : -1;
          return 0;
        });
      }

      return list;
    }

    function updateSortIndicators() {
      document.querySelectorAll('th.sortable').forEach((th) => {
        const arrow = th.querySelector('.sort-arrow');
        arrow.textContent = th.dataset.sort === sortKey ? (sortDir === 'asc' ? '▲' : '▼') : '';
      });
    }

    function renderRows() {
      const tbody = document.getElementById('item-rows');
      tbody.innerHTML = '';
      const visible = getVisibleItems();

      document.getElementById('results-count').textContent =
        `${visible.length} of ${items.length} item${items.length === 1 ? '' : 's'}`;

      if (items.length === 0) {
        document.getElementById('table-wrap').style.display = 'none';
        document.getElementById('empty-state').style.display = '';
        document.getElementById('empty-state-text').textContent = 'No items yet. Add your first menu item to get started.';
        return;
      }
      if (visible.length === 0) {
        document.getElementById('table-wrap').style.display = 'none';
        document.getElementById('empty-state').style.display = '';
        document.getElementById('empty-state-text').textContent = 'No items match your search or filters.';
        return;
      }
      document.getElementById('table-wrap').style.display = '';
      document.getElementById('empty-state').style.display = 'none';

      const cats = editMode ? getCategoryList() : null;

      visible.forEach((item) => {
        const tr = document.createElement('tr');
        tr.dataset.id = item.id;

        const thumbCell = item.primary_image_url
          ? `<img class="item-thumb" src="${item.primary_image_url}" alt="" />`
          : `<div class="item-thumb-placeholder">—</div>`;

        if (editMode) {
          const edit = pendingEdits[item.id] || {
            name: item.name, category: item.category || '', price: item.price, status: item.status, tag: item.tag,
          };
          const categoryOptions = cats.map((c) =>
            `<option value="${escapeHtml(c)}" ${edit.category === c ? 'selected' : ''}>${escapeHtml(c)}</option>`
          ).join('');

          tr.innerHTML = `
            <td></td>
            <td>${thumbCell}</td>
            <td class="editing"><input type="text" class="row-edit" data-field="name" value="${escapeHtml(edit.name)}" /></td>
            <td class="editing">
              <select class="row-edit" data-field="category">
                <option value="" ${edit.category === '' ? 'selected' : ''}>— no category —</option>
                ${categoryOptions}
              </select>
            </td>
            <td class="editing"><input type="number" step="0.01" min="0" class="row-edit row-edit-price" data-field="price" value="${edit.price}" /></td>
            <td class="editing">
              <select class="row-edit" data-field="status">
                <option value="active" ${edit.status === 'active' ? 'selected' : ''}>Active</option>
                <option value="sold_out" ${edit.status === 'sold_out' ? 'selected' : ''}>Sold Out</option>
                <option value="inactive" ${edit.status === 'inactive' ? 'selected' : ''}>Inactive</option>
              </select>
            </td>
            <td class="editing">
              <select class="row-edit" data-field="tag">
                <option value="none" ${edit.tag === 'none' ? 'selected' : ''}>None</option>
                <option value="new" ${edit.tag === 'new' ? 'selected' : ''}>New</option>
                <option value="best_seller" ${edit.tag === 'best_seller' ? 'selected' : ''}>Best Seller</option>
                <option value="limited" ${edit.tag === 'limited' ? 'selected' : ''}>Limited</option>
              </select>
            </td>
          `;

          tr.querySelectorAll('[data-field]').forEach((input) => {
            input.addEventListener('input', () => {
              const current = pendingEdits[item.id] || { ...edit };
              const field = input.dataset.field;
              current[field] = field === 'price' ? parseFloat(input.value) || 0 : input.value;
              pendingEdits[item.id] = current;
              markDirty();
            });
          });
        } else {
          tr.innerHTML = `
            <td onclick="event.stopPropagation()"><input type="radio" name="select-item" data-select ${item.id === selectedId ? 'checked' : ''} /></td>
            <td>${thumbCell}</td>
            <td>
              <strong>${escapeHtml(item.name)}</strong>
              ${item.featured ? ' <span class="badge badge-featured">★</span>' : ''}
            </td>
            <td>${escapeHtml(item.category || '—')}</td>
            <td>${money(item.price)}</td>
            <td><span class="badge badge-${item.status}">${statusLabel(item.status)}</span></td>
            <td>${tagLabel(item.tag) ? `<span class="badge badge-tag">${tagLabel(item.tag)}</span>` : ''}</td>
          `;

          tr.addEventListener('click', () => {
            window.location.href = `/admin/item.html?id=${item.id}`;
          });
          const radio = tr.querySelector('[data-select]');
          radio.addEventListener('click', (e) => {
            e.stopPropagation();
            // Radios don't natively toggle off on a second click — do it manually.
            if (selectedId === item.id) {
              selectedId = null;
              radio.checked = false;
              document.getElementById('btn-duplicate').disabled = true;
            } else {
              selectedId = item.id;
              document.getElementById('btn-duplicate').disabled = false;
            }
          });
        }

        tbody.appendChild(tr);
      });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    async function loadItems() {
      const { data: itemRows, error } = await sb
        .from('items')
        .select('*')
        .order('sort_order', { ascending: true });

      if (error) {
        console.error(error);
        document.getElementById('loading').textContent = 'Failed to load items.';
        return;
      }

      const { data: imageRows } = await sb
        .from('item_images')
        .select('item_id, storage_url, is_primary')
        .eq('is_primary', true);

      const primaryByItem = {};
      (imageRows || []).forEach((img) => { primaryByItem[img.item_id] = img.storage_url; });

      items = (itemRows || []).map((it) => ({ ...it, primary_image_url: primaryByItem[it.id] || null }));

      document.getElementById('loading').style.display = 'none';
      document.getElementById('items-toolbar').style.display = '';
      populateCategoryFilter();
      renderRows();
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      if (editMode) return;
      filters.search = e.target.value;
      renderRows();
    });
    document.getElementById('filter-category').addEventListener('change', (e) => {
      if (editMode) return;
      filters.category = e.target.value;
      renderRows();
    });
    document.getElementById('filter-status').addEventListener('change', (e) => {
      if (editMode) return;
      filters.status = e.target.value;
      renderRows();
    });
    document.getElementById('filter-tag').addEventListener('change', (e) => {
      if (editMode) return;
      filters.tag = e.target.value;
      renderRows();
    });

    document.querySelectorAll('th.sortable').forEach((th) => {
      th.addEventListener('click', () => {
        if (editMode) return;
        const key = th.dataset.sort;
        if (sortKey === key) {
          sortDir = sortDir === 'asc' ? 'desc' : 'asc';
        } else {
          sortKey = key;
          sortDir = 'asc';
        }
        updateSortIndicators();
        renderRows();
      });
    });

    function setToolbarDisabled(disabled) {
      ['search-input', 'filter-category', 'filter-status', 'filter-tag'].forEach((id) => {
        document.getElementById(id).disabled = disabled;
      });
      document.getElementById('editing-note').style.display = disabled ? '' : 'none';
    }

    document.getElementById('btn-edit-table').addEventListener('click', () => {
      editMode = true;
      pendingEdits = {};
      document.getElementById('actions-normal').style.display = 'none';
      document.getElementById('actions-editing').style.display = '';
      setToolbarDisabled(true);
      renderRows();
    });

    document.getElementById('btn-cancel-edit').addEventListener('click', () => {
      editMode = false;
      pendingEdits = {};
      dirty = false;
      document.getElementById('actions-normal').style.display = '';
      document.getElementById('actions-editing').style.display = 'none';
      setToolbarDisabled(false);
      renderRows();
    });

    document.getElementById('btn-save-edit').addEventListener('click', async () => {
      const btn = document.getElementById('btn-save-edit');
      const edits = Object.entries(pendingEdits);
      for (const [, edit] of edits) {
        if (!edit.name || !edit.name.trim()) {
          alert('Every item needs a name — check the highlighted rows before saving.');
          return;
        }
      }

      btn.disabled = true;
      btn.textContent = 'Saving…';
      for (const [itemId, edit] of edits) {
        const original = items.find((i) => i.id === itemId);
        if (!original) continue;
        const payload = { name: edit.name.trim(), category: edit.category, price: edit.price, status: edit.status, tag: edit.tag };
        const historyLines = diffItemFields(original, payload);
        if (!historyLines.length) continue;
        const { error } = await sb.from('items').update(payload).eq('id', itemId);
        if (error) {
          alert(`Could not save "${original.name}": ${error.message}`);
          continue;
        }
        await logEditHistory('item', itemId, historyLines);
      }
      btn.disabled = false;
      btn.textContent = 'Save Changes';

      editMode = false;
      pendingEdits = {};
      dirty = false;
      document.getElementById('actions-normal').style.display = '';
      document.getElementById('actions-editing').style.display = 'none';
      setToolbarDisabled(false);
      await loadItems();
    });

    document.getElementById('btn-duplicate').addEventListener('click', async () => {
      if (!selectedId) return;
      const source = items.find((i) => i.id === selectedId);
      if (!source) return;

      const { id, created_at, updated_at, primary_image_url, ...rest } = source;
      rest.name = source.name + ' (Copy)';

      const { data, error } = await sb.from('items').insert(rest).select().single();
      if (error) {
        alert('Could not duplicate item: ' + error.message);
        return;
      }
      window.location.href = `/admin/item.html?id=${data.id}`;
    });

    (async () => {
      const session = await requireSession();
      if (!session) return;
      wireSignOutButtons();
      loadItems();
    })();
  </script>
</body>
</html>
