<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kiosk | Tealux Cafe Tampa Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="/admin/css/admin.css" />
  <style>
    .kiosk-card-row { display: flex; align-items: center; gap: 16px; }
    .kiosk-card-row .item-thumb, .kiosk-card-row .item-thumb-placeholder { flex-shrink: 0; }
    .kiosk-card-row .card-info { flex: 1; min-width: 0; }
    .kiosk-card-row .card-info h3 { font-size: 0.95rem; margin-bottom: 2px; }
    .kiosk-card-row .card-info p {
      font-family: 'Arial', sans-serif; font-size: 0.8rem; opacity: 0.6;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .kiosk-card-row .card-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .kiosk-card-row .card-actions button {
      background: transparent; border: 2px solid var(--border); border-radius: 6px;
      width: 32px; height: 32px; cursor: pointer; font-size: 0.9rem; font-family: inherit;
    }
    .kiosk-card-row .card-actions button:hover { border-color: var(--black); }
    .kiosk-card-row .card-actions button:disabled { opacity: 0.3; cursor: not-allowed; }
    .kiosk-list { display: flex; flex-direction: column; gap: 12px; }
    .kiosk-list .panel { padding: 16px 20px; }

    .card-editor { margin-top: 24px; }
    .upload-tile {
      border: 2px dashed var(--border); border-radius: 8px; aspect-ratio: 16/9;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      font-size: 0.8rem; opacity: 0.5; text-align: center; background-size: cover; background-position: center;
    }
    .upload-tile:hover { opacity: 1; border-color: var(--black); }
    .upload-tile.has-image { opacity: 1; border-style: solid; color: transparent; }
  </style>
</head>
<body>
  <nav class="admin-nav">
    <a href="/admin/items.html" class="admin-logo">
      <span class="admin-logo-main">TEALUX CAFE</span>
      <span class="admin-logo-sub">EMPLOYEE TOOLS</span>
    </a>
    <ul class="admin-nav-links">
      <li><a href="/admin/items.html">Items</a></li>
      <li><a href="/admin/boards.html">Menu Boards</a></li>
      <li><a href="/kiosk/admin/manage.html" class="active">Kiosk</a></li>
      <li><button type="button" data-signout>Log Out</button></li>
    </ul>
  </nav>

  <main class="admin-main">
    <div class="admin-header-row">
      <h1>Kiosk Display</h1>
      <div class="admin-actions">
        <button type="button" class="btn btn-crimson" id="btn-add">+ Add Card</button>
      </div>
    </div>

    <div class="form-error" id="form-error"></div>

    <div id="loading" class="spinner-row"><span class="loading-spinner"></span></div>
    <div class="kiosk-list" id="kiosk-list" style="display:none;"></div>
    <div class="empty-state" id="empty-state" style="display:none;">
      No kiosk cards yet. Add one to start showing content on the counter display.
    </div>

    <!-- EDITOR -->
    <div class="panel card-editor" id="card-editor" style="display:none;">
      <h2 id="editor-title" style="font-size:1.1rem; margin-bottom:20px;">Add Card</h2>
      <input type="hidden" id="card-id" />

      <div class="field">
        <label for="card-type">Type</label>
        <select id="card-type">
          <option value="promo">Promo / Announcement</option>
          <option value="highlight">This Week's Highlight</option>
        </select>
      </div>

      <div class="field">
        <label for="card-title">Title (optional)</label>
        <input type="text" id="card-title" placeholder="Leave blank if your photo/video already has text on it" />
      </div>

      <div class="field checkbox-field">
        <input type="checkbox" id="card-show-title" checked />
        <label for="card-show-title">Show title on the kiosk display</label>
      </div>

      <div class="field">
        <label for="card-subtitle">Subtitle / Description</label>
        <textarea id="card-subtitle" placeholder="Short blurb shown under the title"></textarea>
      </div>

      <div class="field">
        <label for="card-price">Price (optional)</label>
        <input type="text" id="card-price" placeholder="e.g. $6.50 or Starting at $6.50" />
      </div>

      <div class="field">
        <label>Photo or Video</label>
        <div class="upload-tile" id="upload-tile">+ Add photo or video</div>
        <input type="file" id="file-input" accept="image/*,video/*" style="display:none;" />
      </div>

      <div class="field">
        <label for="card-duration">Display Duration (seconds)</label>
        <input type="number" id="card-duration" min="3" step="1" placeholder="12" />
      </div>

      <div class="field checkbox-field">
        <input type="checkbox" id="card-active" checked />
        <label for="card-active">Active (shown on the kiosk)</label>
      </div>

      <div class="admin-actions">
        <button type="button" class="btn btn-dark" id="btn-save">Save</button>
        <button type="button" class="btn btn-outline" id="btn-cancel">Cancel</button>
        <button type="button" class="btn btn-danger" id="btn-delete" style="display:none;">Delete</button>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/admin/js/supabase-client.js"></script>
  <script src="/kiosk/admin/js/kiosk-admin.js"></script>
</body>
</html>
